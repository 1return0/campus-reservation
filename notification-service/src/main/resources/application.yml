spring:
  config:
    import: optional:file:./deploy/.env[.properties]
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:mysql://127.0.0.1:3306/campus_notification?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${NOTIFICATION_DB_USERNAME:campus_notification_app}
    password: ${NOTIFICATION_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}

campus-reserve:
  security:
    jwt:
      hmac-base64-secret: ${CAMPUS_JWT_HMAC_SECRET:}
      issuer: ${CAMPUS_JWT_ISSUER:campus-reserve}
  messaging:
    consumer:
      enabled: ${RESERVATION_EVENT_CONSUMER_ENABLED:false}
      retry:
        max-attempts: 3
        initial-interval-millis: 1000
        multiplier: 2.0
        max-interval-millis: 5000

server:
  port: ${SERVER_PORT:8203}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
